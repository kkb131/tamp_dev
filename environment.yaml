# Conda environment for operator PC (조종 PC)
# 통합 텔레옵 프로토콜 sender 실행 환경
#
# Senders (모두 robot base_link 프레임의 절대 포즈를 UDP로 전송):
#   python3 -m vive.vive_sender      --target-ip <ROBOT_IP>  # Vive Tracker (SteamVR 필요)
#   python3 -m vive.keyboard_sender  --target-ip <ROBOT_IP>  # 키보드 WASDQE
#   python3 -m vive.joystick_sender  --target-ip <ROBOT_IP>  # Xbox/Logitech 게임패드
#   python3 -m manus.manus_sender    --target-ip <ROBOT_IP>  # Manus 글러브 (별도 프로토콜)
#
# Setup:
#   conda env create -f environment.yaml
#   conda activate tamp_sender

name: tamp_sender
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - libusb                  # Manus SDK (libManusSDK.so)
  - pip
  - pip:
    - openvr>=1.26.701      # SteamVR / Vive Tracker (vive_sender)
    - numpy                 # 좌표변환, 쿼터니언 적분 (전체 sender 공통)
    - pynput>=1.7.6         # 키보드 입력 (vive_sender, keyboard_sender)
    - pyyaml>=6.0           # Vive config 파싱 (vive_sender)
    - pygame>=2.0.0         # 조이스틱/게임패드 입력 (joystick_sender)
    - pymodbus>=3.10,<4     # Tesollo DG5F Modbus TCP (3.10+ uses device_id= API)
