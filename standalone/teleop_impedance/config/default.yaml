robot:
  ip: "192.168.0.2"
  mode: "sim"

control:
  frequency_sim: 50
  frequency_rtde: 125

input:
  type: "keyboard"
  cartesian_step: 0.01
  rotation_step: 0.05
  xbox_linear_scale: 0.03
  xbox_angular_scale: 0.08
  network_port: 9870
  network_linear_scale: 0.005
  network_angular_scale: 0.015

filter:
  alpha_position: 0.55           # soft teleop: smoother motion (was 0.85)
  alpha_orientation: 0.55        # soft teleop: smoother rotation (was 0.85)

ik:
  position_cost: 1.0
  orientation_cost: 0.3          # reduced: less wrist velocity spike (was 0.5)
  posture_cost: 1.0e-2
  damping: 1.0e-6               # singularity stabilization (was 1e-12)
  soft_sync_alpha: 0.08          # faster drift correction for impedance (was 0.05)

safety:
  packet_timeout_ms: 2000      # keyboard is event-based; hold torque between keypresses
  max_joint_vel: 0.4             # slow motion for soft teleop (was 1.0)
  max_position_deviation: 0.25   # tighter with soft gains (was 0.3)
  max_ee_velocity: 0.12          # slow EE speed (was 0.2)
  workspace:
    x: [-0.8, 0.8]
    y: [-0.8, 0.8]
    z: [0.05, 1.2]

impedance:
  default_preset: "TELEOP_SOFT"  # new soft teleop preset (was SOFT)
  gain_scale_range: [0.25, 2.0]
  enable_coriolis_comp: true
  max_joint_error: [0.10, 0.10, 0.12, 0.18, 0.18, 0.2]  # rad — moderate tightening to reduce yaw coupling
